<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Car Game</h1>
      <div class="hud">
        <div class="hud-item">
          <span class="label">Score</span>
          <span id="score">0</span>
        </div>
        <div class="hud-item">
          <span class="label">Best</span>
          <span id="best">0</span>
        </div>
      </div>

      <div class="game-stage">
        <canvas id="gameCanvas" width="420" height="640" aria-label="Car game"></canvas>
        <div id="startScreen" class="start-screen">
          <h2 id="screenTitle">Ready to race?</h2>
          <p id="screenMessage">Dodge the traffic and get the highest score!</p>
          <button id="startButton" class="start-button" type="button">Start game</button>
        </div>
      </div>

      <div class="controls">
        <span>Keyboard: ← → or A / D</span>
        <button id="soundButton" class="sound-button" type="button" aria-pressed="true">🔊 Sound on</button>
      </div>
      <div class="touch-controls" aria-label="Touch steering controls">
        <button class="steer-button" type="button" data-direction="left" aria-label="Steer left">◀ Left</button>
        <button class="steer-button" type="button" data-direction="right" aria-label="Steer right">Right ▶</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
